jobs:
  - reduce_sectors:
      reduce:
        - {topologies: [OS], sectors: [3], r: 5, s: 5}
        - {topologies: [SE], sectors: [3], r: 5, s: 5}
        - {topologies: [UV], sectors: [1], r: 5, s: 5}
